name: Build APK (VetCare Post-Op)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.0
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # Tạo android/ nếu chưa có và ép tên dự án hợp lệ
      - name: Ensure android project exists (force valid name)
        run: |
          if [ ! -d "android" ]; then
            flutter create --project-name vetcare_postop .
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vetcare-postop-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
